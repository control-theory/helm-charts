replicaCount: 1
image:
  repository: controltheory/aigent
  pullPolicy: Always
  # tag: override to use a different image than Chart.appVersion

deployment:
  controlplane:
    admission_token: "you-need-to-provide-it"
    endpoint: "ws://controlplane:4320/v1/opamp"
  cluster_name: "" # Kubernetes cluster name for resource attribution
  deployment_env: "" # Deployment environment (e.g., prod, staging, dev)
  source_id: "" # Required source ID
  args:
    - start
    - --role
    - "aigent:k8sCluster"
  nodeSelector: {}
  env: {}

# Node Scheduling - any node that has capacity
tolerateAllTaints: true
tolerateTaintKeys: []
tolerations: []

resources:
  enabled: false
  cpu:
    limit: 500m
  memory:
    limit: 2Gi

serviceAccount:
  create: true

service:
  otelhttp:
    type: ClusterIP
    port: 1758
  otelgrpc:
    type: ClusterIP
    port: 1757

# Prometheus scraping from the cluster agent (kube-state-metrics, annotated
# apps). Off, the ClusterRole is exactly what event collection needs. On, it
# adds endpoints and endpointslices (get/list/watch) to find scrape targets.
# What is scraped is still switched per preset on the source in Dstl8. This
# chart never installs kube-state-metrics.
metricsScrape:
  enabled: false
