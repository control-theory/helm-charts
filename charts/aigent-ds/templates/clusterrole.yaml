{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-role
  labels:
    {{- include "aigent-ds.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
{{- if .Values.promMetrics.enabled }}
  # Scraping this node's kubelet: /metrics and /metrics/cadvisor on :10250
  # need only nodes/metrics, never nodes/proxy. node-exporter is found through
  # pods, granted above.
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
{{- end }}
{{- end }}
