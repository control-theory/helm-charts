---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aigent-ds.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.otelgrpc.type }}
  # Local is load-bearing: a sender reaches the agent on its own node, so all
  # of one sender's series land in one agent. Spread across agents, a
  # sender's series would give partial minutes and broken counter deltas.
  # The chart tests pin it.
  internalTrafficPolicy: Local
  selector:
    {{- include "aigent-ds.selectorLabels" . | nindent 4 }}
  ports:
    - name: otelhttp
      protocol: TCP
      port: {{ .Values.service.otelhttp.port }}
      targetPort: {{ .Values.service.otelhttp.port }}
    - name: otelgrpc
      protocol: TCP
      port: {{ .Values.service.otelgrpc.port }}
      targetPort: {{ .Values.service.otelgrpc.port }}
{{- if .Values.remoteWrite.enabled }}
    - name: remote-write
      protocol: TCP
      port: {{ .Values.remoteWrite.port }}
      targetPort: {{ .Values.remoteWrite.port }}
{{- end }}
