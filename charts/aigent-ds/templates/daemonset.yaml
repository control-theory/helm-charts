---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aigent-ds.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "aigent-ds.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "aigent-ds.selectorLabels" . | nindent 8 }}
    spec:
{{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Release.Name }}-sa
{{- end }}
{{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
{{- end }}
{{- if .Values.tolerateAllTaints }}
      tolerations:
        - operator: "Exists"
{{- else if gt (len .Values.tolerateTaintKeys) 0 }}
      tolerations:
        {{- range .Values.tolerateTaintKeys }}
        - key: {{ . | quote }}
          operator: "Exists"
        {{- end }}
{{- else if gt (len .Values.tolerations) 0 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
{{- end }}
{{- if .Values.state.hostPath.enabled }}
      # The node keeps the state across pods, and across uninstalls too. A
      # reinstall gets a new instance_uid (the agentid ConfigMap goes with the
      # release), so state another install left is cleared here: resumed weeks
      # later, it would read every log on the node from the start. Upgrades
      # keep the uid, and so the offsets.
      initContainers:
      - name: state-owner
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        command:
          - sh
          - -c
          - |
            if [ "$(cat /state/.owner 2>/dev/null)" != "$AGENT_BASE_ID" ]; then
              rm -rf /state/* /state/.[!.]*
              printf '%s' "$AGENT_BASE_ID" > /state/.owner
            fi
        env:
          - name: AGENT_BASE_ID
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-agentid
                key: instance_uid
        volumeMounts:
        - name: state
          mountPath: /state
{{- end }}
      containers:
      - name: {{ .Release.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
{{- if and .Values.resources .Values.resources.enabled }}
        resources:
{{- if or .Values.resources.cpu.request .Values.resources.memory.request }}
          requests:
{{- with .Values.resources.cpu.request }}
            cpu: "{{ . }}"
{{- end }}
{{- with .Values.resources.memory.request }}
            memory: "{{ . }}"
{{- end }}
{{- end }}
          limits:
            cpu: "{{ .Values.resources.cpu.limit }}"
            memory: "{{ .Values.resources.memory.limit }}"
{{- end }}
{{- if .Values.daemonset.args }}
        args:
          {{- range .Values.daemonset.args }}
          - {{ . | quote }}
          {{- end }}
{{- end }}
        env:
          - name: AGENT_TYPE
            value: "aigent"
          - name: AGENT_BASE_ID
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-agentid
                key: instance_uid
          - name: K8S_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: K8S_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
{{- if .Values.daemonset.controlplane }}
          - name: CONTROLPLANE_ENDPOINT
            value: "{{ .Values.daemonset.controlplane.endpoint }}"
          - name: ADMISSION_TOKEN
            value: "{{ .Values.daemonset.controlplane.admission_token }}"
{{- end }}
{{- if .Values.daemonset.org_api_endpoint }}
          - name: CT_ORG_API_ENDPOINT
            value: "{{ .Values.daemonset.org_api_endpoint }}"
{{- end }}
{{- if .Values.daemonset.org_dns_id }}
          - name: CT_ORG_DNS_ID
            value: "{{ .Values.daemonset.org_dns_id }}"
{{- end }}
{{- if .Values.daemonset.cluster_name }}
          - name: CLUSTER_NAME
            value: "{{ .Values.daemonset.cluster_name }}"
{{- end }}
{{- if .Values.daemonset.source_id }}
          - name: SOURCE_ID
            value: "{{ .Values.daemonset.source_id }}"
{{- end }}
          - name: SOURCE_TYPE
            value: "kubernetes"
{{- if .Values.daemonset.deployment_env }}
          - name: DEPLOYMENT_ENV
            value: "{{ .Values.daemonset.deployment_env }}"
{{- end }}
{{- if .Values.daemonset.data_endpoint }}
          - name: CT_BUTLER_ENDPOINT
            value: "{{ .Values.daemonset.data_endpoint }}"
{{- end }}
{{- if .Values.daemonset.data_tls }}
          - name: CT_USE_TLS
            value: "{{ .Values.daemonset.data_tls }}"
{{- end }}
        {{- range $name, $value := .Values.daemonset.env }}
          - name: {{ $name }}
            value: "{{ $value }}"
        {{- end }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
{{- if .Values.state.hostPath.enabled }}
        # The agent's own state that should outlive the pod: the filelog
        # receiver's offsets (/tmp/aigent/filelog), so a replaced pod resumes
        # each log where the last one stopped instead of skipping to its end.
        - name: state
          mountPath: /tmp/aigent
{{- end }}
        - name: varlog
          mountPath: /var/log
          readOnly: true
        ports:
          - name: otelhttp
            containerPort: {{ .Values.service.otelhttp.port }}
            {{- if .Values.hostPort.enabled }}
            hostPort: {{ .Values.service.otelhttp.port }}
            {{- end }}
          - name: otelgrpc
            containerPort: {{ .Values.service.otelgrpc.port }}
            {{- if .Values.hostPort.enabled }}
            hostPort: {{ .Values.service.otelgrpc.port }}
            {{- end }}
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
{{- if .Values.state.hostPath.enabled }}
      - name: state
        hostPath:
          path: {{ printf "%s/%s/%s" (trimSuffix "/" .Values.state.hostPath.path) .Release.Namespace .Release.Name | quote }}
          type: DirectoryOrCreate
{{- end }}
      - name: varlog
        hostPath:
          path: /var/log
{{- if .Values.daemonset.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.daemonset.nodeSelector | nindent 8 }}
{{- end }}
